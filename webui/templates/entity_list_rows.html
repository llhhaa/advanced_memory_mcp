{% for entity in entities %}
<tr>
  <td><a href="/ui/entity/{{ entity.name|pathsegment }}">{{ entity.name }}</a></td>
  <td>{{ entity.entityType }}</td>
  <td class="num">{{ entity.observations|length }}</td>
  <td class="muted">{{ entity.lastUpdated or '' }}</td>
</tr>
{% else %}
<tr><td colspan="4" class="empty">No entities match.</td></tr>
{% endfor %}
